name: Deploy

# Sobe na VPS por SSH. Dispara só quando o CI da branch padrão fecha verde,
# então commit quebrado nunca chega em produção. Também dá para rodar na mão
# pela aba Actions (Run workflow), útil para repetir um deploy que falhou no
# meio sem precisar de um commit novo.
#
# Este caminho é OPCIONAL: exige guardar a chave privada da VPS como segredo.
# A alternativa, sem segredo nenhum, é a VPS se atualizar sozinha —
# `deploy/instalar-atualizacao-automatica.sh`, descrito no DEPLOY.md. Quando os
# segredos não estão configurados, o job avisa e sai sem falhar, para não
# pintar de vermelho todo merge de quem usa a atualização automática.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - claude/whatsapp-support-platform-ezyvx0
      - main
      - master
  workflow_dispatch:

# Um deploy por vez, e nunca cancelar um que já começou: interromper no meio
# do `docker compose up` deixaria a VPS em estado indefinido.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar a VPS
    runs-on: ubuntu-latest
    # Os segredos do deploy (VPS_HOST, VPS_USER, VPS_SSH_KEY e os opcionais
    # VPS_PORT/VPS_KNOWN_HOSTS) ficam no environment `production`. Segredo de
    # environment só existe para o job que o declara: sem esta linha, todos
    # chegam vazios e o deploy morre na conferência logo abaixo.
    environment: production
    # No workflow_dispatch não existe workflow_run, e aí a condição do CI verde
    # não se aplica — quem clicou assumiu a responsabilidade.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Conferir se os segredos estão configurados
        id: segredos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          faltando=""
          [ -z "$VPS_HOST" ] && faltando="$faltando VPS_HOST"
          [ -z "$VPS_USER" ] && faltando="$faltando VPS_USER"
          [ -z "$VPS_SSH_KEY" ] && faltando="$faltando VPS_SSH_KEY"
          if [ -n "$faltando" ]; then
            # Sem segredo não dá para entrar na VPS — mas isso é o esperado
            # em quem usa a atualização automática. Avisa e encerra em verde.
            echo "::warning::Deploy por SSH não configurado (faltando:$faltando). Pulando — se a VPS usa a atualização automática, ela se vira sozinha; se quiser o SSH, veja o DEPLOY.md."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar a chave SSH
        if: steps.segredos.outputs.configurado == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          porta="${VPS_PORT:-22}"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            # Preferido: a identidade do servidor vem de um segredo, não da rede.
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS não configurado — a chave do servidor será aceita na primeira conexão (TOFU)."
            ssh-keyscan -p "$porta" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # Escreve as variáveis da integração com o Azevedo-OS no .env da VPS.
      #
      # Existe para que ligar a integração não exija SSH: quem administra
      # cadastra os segredos aqui no GitHub e o deploy leva para a VPS. O .env
      # continua sendo a fonte em produção — este passo só o mantém em dia.
      #
      # Três decisões que valem explicação:
      #
      # 1. **Sem os segredos, não encosta no .env.** Faltando URL ou token o
      #    passo sai em verde sem escrever nada, porque quem configurou à mão
      #    na VPS não pode ter o arquivo apagado por um deploy.
      # 2. **Remove antes de acrescentar.** Sem isso cada deploy empilharia uma
      #    cópia das linhas; a última venceria e o diagnóstico do dia em que o
      #    valor mudasse seria um inferno.
      # 3. **O token vai por stdin, não na linha de comando.** Passar como
      #    argumento do ssh o deixaria visível em `ps` na VPS. Vai em base64
      #    dentro do heredoc — não é sigilo, é transporte seguro de um valor
      #    que pode conter qualquer caractere.
      - name: Configurar a integração com o Azevedo-OS
        if: steps.segredos.outputs.configurado == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          AZEVEDO_OS_API_URL: ${{ secrets.AZEVEDO_OS_API_URL }}
          AZEVEDO_OS_API_TOKEN: ${{ secrets.AZEVEDO_OS_API_TOKEN }}
          AZEVEDO_OS_WEB_URL: ${{ secrets.AZEVEDO_OS_WEB_URL }}
          AZEVEDO_OS_TIMEOUT_MS: ${{ secrets.AZEVEDO_OS_TIMEOUT_MS }}
        run: |
          set -euo pipefail
          if [ -z "${AZEVEDO_OS_API_URL:-}" ] || [ -z "${AZEVEDO_OS_API_TOKEN:-}" ]; then
            echo "::notice::Integração com o Azevedo-OS não configurada (faltam os segredos AZEVEDO_OS_API_URL e/ou AZEVEDO_OS_API_TOKEN). O .env da VPS fica como está."
            exit 0
          fi
          porta="${VPS_PORT:-22}"
          caminho="${VPS_PATH:-}"
          fragmento=$(
            {
              printf 'AZEVEDO_OS_API_URL=%s\n' "$AZEVEDO_OS_API_URL"
              printf 'AZEVEDO_OS_API_TOKEN=%s\n' "$AZEVEDO_OS_API_TOKEN"
              if [ -n "${AZEVEDO_OS_WEB_URL:-}" ]; then
                printf 'AZEVEDO_OS_WEB_URL=%s\n' "$AZEVEDO_OS_WEB_URL"
              fi
              printf 'AZEVEDO_OS_TIMEOUT_MS=%s\n' "${AZEVEDO_OS_TIMEOUT_MS:-5000}"
            } | base64 -w0
          )
          ssh -i ~/.ssh/id_deploy -p "$porta" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "CAMINHO='$caminho' bash -s" <<REMOTO
          set -eu
          cd "\${CAMINHO:-\$HOME/Whatsapp}"
          umask 077
          touch .env
          # grep -v sai 1 quando não sobra nenhuma linha (arquivo só com essas,
          # ou vazio). Não é erro aqui, daí o || true.
          grep -v '^AZEVEDO_OS_' .env > .env.deploy || true
          printf '%s' '$fragmento' | base64 -d >> .env.deploy
          mv .env.deploy .env
          chmod 600 .env
          echo "==> .env atualizado: \$(grep -c '^AZEVEDO_OS_' .env) variáveis do Azevedo-OS"
          REMOTO

      - name: Atualizar e subir os containers
        if: steps.segredos.outputs.configurado == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          # Onde o repositório está clonado na VPS. Padrão: ~/Whatsapp
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_BRANCH: claude/whatsapp-support-platform-ezyvx0
        run: |
          set -euo pipefail
          porta="${VPS_PORT:-22}"
          caminho="${VPS_PATH:-}"
          ssh -i ~/.ssh/id_deploy -p "$porta" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_BRANCH='$DEPLOY_BRANCH' CAMINHO='$caminho' bash -s" <<'REMOTO'
          set -euo pipefail
          cd "${CAMINHO:-$HOME/Whatsapp}"

          echo "==> Atualizando o código"
          git fetch origin "$DEPLOY_BRANCH"
          # Garante que o deploy atualiza a branch certa, mesmo que a VPS
          # tenha ficado em HEAD solto ou em outra branch.
          git checkout "$DEPLOY_BRANCH" 2>/dev/null || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          # --ff-only falha em vez de criar merge: se alguém editou arquivo
          # versionado direto na VPS, o deploy para e avisa, em vez de
          # sobrescrever em silêncio.
          git merge --ff-only "origin/$DEPLOY_BRANCH"
          echo "Commit em produção: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

          echo "==> Subindo os containers"
          # As migrations rodam no boot da API; as sessões de WhatsApp ficam
          # em volume nomeado e sobrevivem ao restart.
          docker compose -f docker-compose.prod.yml up -d --build

          echo "==> Estado dos containers"
          docker compose -f docker-compose.prod.yml ps
          REMOTO

      - name: Confirmar que a API subiu
        if: steps.segredos.outputs.configurado == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          porta="${VPS_PORT:-22}"
          caminho="${VPS_PATH:-}"
          ssh -i ~/.ssh/id_deploy -p "$porta" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "CAMINHO='$caminho' bash -s" <<'REMOTO'
          set -euo pipefail
          cd "${CAMINHO:-$HOME/Whatsapp}"
          # A API leva alguns segundos para aplicar migrations e abrir a porta.
          for tentativa in $(seq 1 20); do
            if docker compose -f docker-compose.prod.yml logs --since 5m api 2>/dev/null | grep -q api_started; then
              echo "API no ar."
              exit 0
            fi
            sleep 5
          done
          echo "A API não registrou api_started em 100s. Últimas linhas do log:"
          docker compose -f docker-compose.prod.yml logs --tail=40 api
          exit 1
          REMOTO

      - name: Limpar a chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
