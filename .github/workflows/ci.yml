name: CI

on:
  pull_request:
  push:
    # A branch padrão do repositório, mais os nomes usuais caso ela seja
    # renomeada no futuro. PRs já são cobertos pelo gatilho acima.
    branches:
      - claude/whatsapp-support-platform-ezyvx0
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    env:
      # O `prisma generate` exige a variável do datasource, mas não abre
      # conexão: nenhum banco é acessado durante o CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapdesk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        # A versão vem do campo `packageManager` do package.json.
        uses: pnpm/action-setup@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          # Mesma major dos Dockerfiles de api e web (node:22-slim).
          node-version: 22
          cache: pnpm

      - name: Usar HTTPS nas dependências git do GitHub
        # O Baileys puxa `libsignal` por URL SSH (git@github.com:...) e o
        # runner não tem chave publicada, então o clone falha com
        # "Permission denied (publickey)". O rewrite manda o mesmo clone
        # sair por HTTPS, sem alterar o lockfile.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Testes
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
